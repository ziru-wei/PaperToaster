<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF AI Inspector</title>
    <link rel="stylesheet" href="./sidepanel.css">
  </head>
  <body>
    <main>
      <header>
        <div class="title-stack">
          <div class="title-row">
            <input id="documentTitle" class="document-title muted" type="text" placeholder="Title not loaded" aria-label="Document title">
          </div>
          <div id="tabStatus" class="url-line muted">Loading...</div>
          <div id="pdfStatus" class="status-line muted">Loading...</div>
        </div>
        <button id="reloadPdf" class="icon-button reload-button" type="button" title="Reload PDF" aria-label="Reload PDF">
          <span aria-hidden="true">↻</span>
        </button>
      </header>

      <section class="chat-panel">
        <div id="conversationThread" class="conversation-thread" hidden></div>
        <div class="composer">
          <div id="selectionStatus" class="muted">Select text in the PDF viewer.</div>
          <blockquote id="selectionText" class="selection-quote"></blockquote>
          <button id="toggleSelectionText" class="selection-toggle" type="button" aria-label="Expand selected text" hidden>
            <span aria-hidden="true">⌄</span>
          </button>
          <form id="selectionQuestionForm">
            <div class="prompt-field">
              <textarea id="selectionQuestion" rows="4" placeholder="Ask about selected text. Type / for prompts."></textarea>
              <div id="promptPresetMenu" class="prompt-preset-menu" role="listbox" hidden></div>
            </div>
            <button id="askSelectionAi" type="submit" disabled>Ask AI</button>
          </form>
          <div id="selectionContextStatus" class="muted"></div>
        </div>
      </section>
    </main>
    <script type="module" src="./sidepanel.js"></script>
  </body>
</html>
