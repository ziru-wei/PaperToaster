<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paper Toaster</title>
    <link rel="stylesheet" href="./sidepanel.css">
  </head>
  <body>
    <main>
      <header>
        <div class="title-stack">
          <div class="url-row">
            <span id="contextReadyIndicator" class="context-ready-indicator loading" title="Preparing context" aria-label="Preparing context">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M20 6 9 17l-5-5"></path>
              </svg>
            </span>
            <button id="reloadPdf" class="mini-icon-button" type="button" title="Reload PDF" aria-label="Reload PDF">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
              </svg>
            </button>
            <button id="copyTabUrl" class="mini-icon-button" type="button" title="Copy URL" aria-label="Copy URL">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
              </svg>
            </button>
            <div id="tabStatus" class="url-line muted">Loading...</div>
            <button id="openDashboard" class="mini-icon-button" type="button" title="Reading Dashboard" aria-label="Reading Dashboard">
              <span class="icon-mask dashboard-entry-icon" aria-hidden="true"></span>
            </button>
            <button id="conversationThreadArchive" class="mini-icon-button thread-archive-button" type="button" title="Conversation history" aria-label="Conversation history">
              <span class="icon-mask thread-archive-icon" aria-hidden="true"></span>
            </button>
            <div id="conversationThreadWheel" class="thread-wheel" aria-label="Conversation history" hidden></div>
          </div>
          <div class="title-row">
            <button id="documentStar" class="document-star" type="button" title="Star paper" aria-label="Star paper" disabled>
              <span aria-hidden="true"></span>
            </button>
            <input id="documentTitle" class="document-title muted" type="text" placeholder="Title not loaded" aria-label="Document title">
          </div>
          <div id="comparisonContextBar" class="comparison-context-bar" hidden>
            <div id="comparisonStatus" class="comparison-status muted"></div>
          </div>
          <div id="pdfStatus" class="status-line muted">Loading...</div>
        </div>
      </header>

      <section class="chat-panel">
        <div id="idleState" class="idle-state" hidden>
          <div class="idle-bubble" aria-label="Feed me a Paper, please.">
            <pre>.--------------------------.
| Feed me a Paper, please. |
'-------------v------------'</pre>
          </div>
          <img class="idle-icon" src="../assets/extension/icon-128.png" alt="">
        </div>
        <div id="conversationThread" class="conversation-thread" hidden></div>
        <div class="composer">
          <div id="comparisonPaperChips" class="comparison-paper-chips" aria-label="Selected comparison papers" hidden></div>
          <div class="composer-input-stack">
            <button id="scrollToLatest" class="scroll-to-latest" type="button" aria-label="Scroll to latest" hidden>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 5v14"></path>
                <path d="m19 12-7 7-7-7"></path>
              </svg>
            </button>
            <div class="selection-quote-layer">
              <blockquote id="selectionText" class="selection-quote empty" tabindex="0" aria-expanded="false"></blockquote>
              <button id="clearSelectionText" class="selection-quote-clear" type="button" aria-label="Remove selected text" hidden>×</button>
            </div>
            <form id="selectionQuestionForm">
              <div class="prompt-field">
                <div id="routeSuggestion" class="route-suggestion" aria-live="polite" hidden></div>
                <textarea id="selectionQuestion" rows="4" placeholder="Type / for prompts"></textarea>
                <div id="newThreadPromptHint" class="new-thread-prompt-hint" hidden>Press ↵ to start a new thread</div>
                <div id="promptPresetMenu" class="prompt-preset-menu" role="listbox" hidden></div>
              </div>
            </form>
          </div>
          <div id="selectionContextStatus" class="muted"></div>
        </div>
      </section>
    </main>
    <div id="savedQaControls" class="saved-qa-controls" hidden>
      <button id="savedQaToggle" class="saved-qa-toggle" type="button" aria-label="Saved Q&A">
        <span class="icon-mask saved-qa-toggle-icon" aria-hidden="true"></span>
      </button>
      <button id="savedQaCollapseToggle" class="saved-qa-collapse-toggle" type="button" aria-label="Collapse notes" hidden>
        <span class="icon-mask saved-qa-collapse-icon" aria-hidden="true"></span>
      </button>
    </div>
    <script type="module" src="./sidepanel.js"></script>
  </body>
</html>
