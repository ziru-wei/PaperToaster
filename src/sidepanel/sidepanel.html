<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF AI Inspector</title>
    <link rel="stylesheet" href="./sidepanel.css">
  </head>
  <body>
    <main>
      <header>
        <div class="title-stack">
          <div class="title-row">
            <button id="documentStar" class="document-star" type="button" title="Star paper" aria-label="Star paper" disabled>
              <span aria-hidden="true"></span>
            </button>
            <input id="documentTitle" class="document-title muted" type="text" placeholder="Title not loaded" aria-label="Document title">
          </div>
          <div class="url-row">
            <span id="contextReadyIndicator" class="context-ready-indicator loading" title="Preparing context" aria-label="Preparing context">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M20 6 9 17l-5-5"></path>
              </svg>
            </span>
            <div id="tabStatus" class="url-line muted">Loading...</div>
            <button id="openDashboard" class="mini-icon-button" type="button" title="Reading Dashboard" aria-label="Reading Dashboard">
              <span class="icon-mask dashboard-entry-icon" aria-hidden="true"></span>
            </button>
            <button id="copyTabUrl" class="mini-icon-button" type="button" title="Copy URL" aria-label="Copy URL">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
              </svg>
            </button>
            <button id="reloadPdf" class="mini-icon-button" type="button" title="Reload PDF" aria-label="Reload PDF">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
              </svg>
            </button>
            <button id="conversationThreadArchive" class="mini-icon-button thread-archive-button" type="button" title="Conversation history" aria-label="Conversation history">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
                <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
              </svg>
            </button>
            <div id="conversationThreadWheel" class="thread-wheel" aria-label="Conversation history" hidden></div>
          </div>
          <div id="pdfStatus" class="status-line muted">Loading...</div>
        </div>
      </header>

      <section class="chat-panel">
        <div id="conversationThread" class="conversation-thread" hidden></div>
        <div class="composer">
          <div class="composer-input-stack">
            <button id="scrollToLatest" class="scroll-to-latest" type="button" title="Scroll to latest" aria-label="Scroll to latest" hidden>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 5v14"></path>
                <path d="m19 12-7 7-7-7"></path>
              </svg>
            </button>
            <blockquote id="selectionText" class="selection-quote" tabindex="0" aria-expanded="false"></blockquote>
            <form id="selectionQuestionForm">
              <div class="prompt-field">
                <textarea id="selectionQuestion" rows="4" placeholder="Type / for prompts"></textarea>
                <div id="newThreadPromptHint" class="new-thread-prompt-hint" hidden>Press ↵ to start a new thread</div>
                <div id="promptPresetMenu" class="prompt-preset-menu" role="listbox" hidden></div>
              </div>
            </form>
          </div>
          <div id="selectionContextStatus" class="muted"></div>
        </div>
      </section>
    </main>
    <script type="module" src="./sidepanel.js"></script>
  </body>
</html>
