<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paper Toaster</title>
    <link rel="stylesheet" href="../components/click-menu.css">
    <link rel="stylesheet" href="../components/glass-button.css">
    <link rel="stylesheet" href="../components/update-notice.css">
    <link rel="stylesheet" href="../components/import-destination-dialog.css">
    <link rel="stylesheet" href="./dashboard.css">
    <link rel="stylesheet" href="../components/paper-label-control.css">
  </head>
  <body>
    <main class="dashboard-shell">
      <header class="dashboard-header">
        <div class="dashboard-controls">
          <div class="sort-control">
            <button id="paperSortButton" class="glass-button sort-button" type="button" title="Sort papers" aria-label="Sort papers" aria-expanded="false">
              <span class="sort-icon" aria-hidden="true"></span>
            </button>
            <div id="paperSortMenu" class="click-menu sort-menu" role="menu" hidden></div>
          </div>
          <div class="sort-control group-control">
            <button id="paperGroupButton" class="glass-button dashboard-icon-button" type="button" title="Group and organize papers" aria-label="Group and organize papers" aria-haspopup="menu" aria-expanded="false">
              <span class="icon-mask group-icon" aria-hidden="true"></span>
            </button>
            <div id="paperGroupMenu" class="click-menu sort-menu" role="menu" hidden></div>
          </div>
          <button id="paperPropertiesButton" class="glass-button dashboard-icon-button" type="button" aria-label="Properties" title="Properties" aria-haspopup="menu" aria-expanded="false">
            <span class="icon-mask properties-icon" aria-hidden="true"></span>
          </button>
          <button id="importPdfButton" class="glass-button dashboard-icon-button" type="button" aria-label="Import PDF" title="Import PDF from this computer (or drop PDFs here)">
            <span class="icon-mask import-pdf-icon" aria-hidden="true"></span>
          </button>
          <input id="importPdfInput" type="file" accept="application/pdf,.pdf" multiple hidden>
          <div class="dashboard-search-control">
            <input id="paperSearch" type="search" placeholder="Loading local papers..." aria-label="Search papers">
          </div>
        </div>
        <div id="paperViewSwitch" class="paper-view-switch" role="radiogroup" aria-label="View"></div>
        <p id="librarySummary" class="dashboard-status" aria-live="polite"></p>
        <details id="googleSyncMenu" class="dashboard-google-sync">
          <summary id="googleSyncIndicator" class="google-sync-menu-button" data-state="disconnected" title="Google sync: not connected" aria-label="Google sync: not connected">
            <span class="icon-mask google-sync-cloud" aria-hidden="true"></span>
            <span class="google-sync-dot" aria-hidden="true"></span>
          </summary>
          <div class="google-sync-popover">
            <p id="googleSyncAccount" class="google-sync-account">Not connected</p>
            <div class="google-sync-actions">
              <button id="googleSyncConnect" class="glass-button" type="button" disabled>Sign in with Google</button>
              <button id="googleSyncDisconnect" class="glass-button" type="button" hidden>Disconnect</button>
            </div>
            <p id="googleSyncStatus" class="google-sync-status" role="status">Loading sync status…</p>
          </div>
        </details>
      </header>

      <section id="bulkActions" class="bulk-actions is-hidden" aria-live="polite" aria-hidden="true">
        <div class="keyboard-prompts" aria-label="Selection shortcuts">
          <p id="multiSelectKeyboardPrompt" hidden></p>
          <p id="selectionSummary" class="selection-summary" hidden>0 selected</p>
          <p id="sendToMachinePrompt" hidden></p>
          <p id="archiveSelectedPrompt" hidden></p>
          <p id="exportSelectedPrompt" hidden></p>
          <p id="deleteSelectedPrompt" hidden></p>
        </div>
        <button id="restoreSelectedButton" class="glass-button bulk-button with-icon" type="button" aria-label="Restore selected records" disabled hidden>
          <span class="icon-mask bulk-action-icon restore-icon" aria-hidden="true"></span>
          <span>Restore</span>
        </button>
        <button id="exportSelectedButton" class="glass-button bulk-button with-icon" type="button" aria-label="Export selected records" disabled hidden>
          <span class="icon-mask bulk-action-icon export-icon" aria-hidden="true"></span>
          <span>Export</span>
        </button>
      </section>
      <section id="paperList" class="paper-list" aria-label="Local papers"></section>
      <div id="emptyState" class="empty-state" hidden>
        <p id="emptyStateMessage">open a PDF to kick off</p>
      </div>
    </main>
    <button id="libraryViewSwitch" class="glass-button dashboard-icon-button" type="button" aria-label="Open Archive">
      <span class="icon-mask library-view-switch-icon" aria-hidden="true"></span>
    </button>
    <button id="sendToMachineButton" class="glass-button dashboard-send-machine" type="button" aria-label="Send selected papers to Comparative Reading" hidden>
      <span class="icon-mask send-to-machine-icon" aria-hidden="true"></span>
    </button>
    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
